name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.18.1

      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm audit --omit=dev
      - run: npm pack --dry-run
