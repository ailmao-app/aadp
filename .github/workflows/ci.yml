name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build-test-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # NOT the package.json "engines" floor (>=20.18.1) — that promise is
        # about the *published package*'s runtime dependencies (ajv,
        # commander, undici), which a consumer on 20.18.1 never has trouble
        # with. This repo's own devDependency chain (vitest 4 -> rolldown)
        # needs Node ^20.19.0 || >=22.12.0 for rolldown's native binding;
        # 20.18.1 fails at "npm test" with "Cannot find native binding" (see
        # ERROR_LOG.md 2026-07-29 and 2026-08-01 for this exact mixup
        # happening twice). 20.19.0 is the oldest Node this repo's *tooling*
        # can run on; 22.12.0 is CI's primary version.
        node-version: ["20.19.0", "22.12.0"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - run: npm ci
      - run: npm run docs:check
      - run: npm run build
      - run: npm test
      - run: npm audit --omit=dev
      - run: npm pack --dry-run

  # Release gate (docs/vi/plans/implementation-plan-v1.0.9.md §11): runs only
  # on a `vX.Y.Z` tag push, so an in-progress branch that legitimately sits
  # ahead of the last release never fails this check.
  release-gate:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-test-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - run: npm ci
      - run: npm run check:release-consistency
